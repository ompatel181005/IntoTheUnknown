[project]
name = "spherex-blink-api"
version = "0.1.0"
description = "FastAPI backend: SPHEREx frame query, cutout fetch, epoch stacking, views API (docs/PLAN.md 4.3)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "numpy>=1.26",
  "astropy>=6.0",
  "reproject>=0.13",
  "astroquery>=0.4.7",
  "azure-monitor-opentelemetry==1.8.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Network and FITS failures are caught broadly on purpose: every failure becomes a clear error, never a hang.
ignore = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
