name: CI

on:
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: has
        run: |
          if [ -f backend/pyproject.toml ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.has.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - if: steps.has.outputs.run == 'true'
        working-directory: backend
        run: |
          pip install -e ".[dev]"
          ruff check .
          ruff format --check .
          pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: has
        run: |
          if [ -f frontend/package.json ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.has.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - if: steps.has.outputs.run == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
          node --experimental-vm-modules --test tests/*.test.mjs

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: has
        run: |
          if ls functions/*.py >/dev/null 2>&1 || [ -f functions/host.json ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.has.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - if: steps.has.outputs.run == 'true'
        working-directory: functions
        run: |
          pip install -r requirements.txt ruff pytest
          ruff check .
          pytest -q

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - working-directory: scripts
        run: |
          pip install pytest numpy astropy scipy playwright
          pytest -q tests

  infrastructure-and-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install pytest ruff
          ruff check infra/*.py infra/tests/test_*.py tools/prewarm_points.py tools/prewarm_bands.py tools/tests
          pytest -q infra/tests tools/tests
          bash infra/check-scripts.sh
          bash infra/tests/run.sh
